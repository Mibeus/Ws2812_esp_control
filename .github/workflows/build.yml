name: Build firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Configure board indexy
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index

      - name: Install jadra (ESP32 + ESP8266)
        run: |
          arduino-cli core install esp32:esp32
          arduino-cli core install esp8266:esp8266

      - name: Install kniznice
        run: |
          arduino-cli lib install "WiFiManager"
          arduino-cli lib install "PubSubClient"
          arduino-cli lib install "Adafruit NeoPixel"
          arduino-cli lib install "ArduinoJson"

      - name: Kompilacia ESP32-C3
        run: arduino-cli compile --fqbn esp32:esp32:esp32c3 --output-dir build/esp32c3 lampa_firmware

      - name: Kompilacia ESP8266
        run: arduino-cli compile --fqbn esp8266:esp8266:d1_mini --output-dir build/esp8266 lampa_firmware_esp8266

      - name: Kompilacia PWM4 (ESP32-C3, 4 nezavisle kanaly)
        run: arduino-cli compile --fqbn esp32:esp32:esp32c3 --output-dir build/pwm4 pwm4_firmware

      - name: Kompilacia Unified (ESP32-C3)
        run: arduino-cli compile --fqbn esp32:esp32:esp32c3 --output-dir build/unified_esp32c3 unified_firmware_esp32c3

      - name: Kompilacia Unified (ESP8266)
        run: arduino-cli compile --fqbn esp8266:esp8266:d1_mini --output-dir build/unified_esp8266 unified_firmware_esp8266

      - name: Vyzbieranie .bin suborov
        run: |
          mkdir -p out
          # *.ino.bin = hlavny aplikacny bin (presne ten, co sa naharava cez /update na webe).
          # ESP32 jadro popri nom generuje aj .bootloader.bin a .partitions.bin - tie nechavame bokom.
          cp build/esp32c3/*.ino.bin out/lampa_firmware_esp32c3.bin
          cp build/esp8266/*.ino.bin out/lampa_firmware_esp8266.bin
          cp build/pwm4/*.ino.bin out/pwm4_firmware.bin
          cp build/unified_esp32c3/*.ino.bin out/unified_firmware_esp32c3.bin
          cp build/unified_esp8266/*.ino.bin out/unified_firmware_esp8266.bin
          ls -la out

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-binaries
          path: out/*.bin

      - name: Publikovanie GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          files: out/*.bin
